<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agents{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
{% if request.session.get("authenticated") %}
  <div class="app-shell">
    <aside class="sidebar">
      <a href="/" class="brand">Mes agents</a>
      <nav class="sidenav">
        <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">
          <span class="sidenav-label">Tableau de bord</span>
        </a>
        <a href="/projects" class="{{ 'active' if request.url.path.startswith('/projects') else '' }}">
          <span class="sidenav-label">Projets</span>
        </a>
        <a href="/clients" class="{{ 'active' if request.url.path.startswith('/clients') else '' }}">
          <span class="sidenav-label">Clients</span>
        </a>
        <a href="/submissions" class="{{ 'active' if request.url.path.startswith('/submissions') else '' }}">
          <span class="sidenav-label">Demandes</span>
        </a>
        <a href="/approvals" class="{{ 'active' if request.url.path.startswith('/approvals') else '' }}">
          <span class="sidenav-label">Approbations</span>
        </a>
        <a href="/security" class="{{ 'active' if request.url.path.startswith('/security') else '' }}">
          <span class="sidenav-label">Securite</span>
        </a>
        <a href="/plans" class="{{ 'active' if request.url.path.startswith('/plans') else '' }}">
          <span class="sidenav-label">Plans marketing</span>
        </a>
      </nav>
      <form method="post" action="/logout" class="logout-form">
        <button type="submit" class="link-button">Se deconnecter</button>
      </form>
    </aside>
    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>
{% else %}
  <main class="main-content main-content--bare">
    {{ self.content() }}
  </main>
{% endif %}
</body>
</html>
