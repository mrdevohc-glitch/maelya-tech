# Un modele par agent. Format : "provider:model_id" (compatible langchain.chat_models.init_chat_model).
# Changer de fournisseur = changer cette ligne, aucun code a toucher.
#
# Configuration actuelle (mise a jour 2026-09-26, cout optimise via OpenRouter) :
# - backend_agent / frontend_agent (le travail de code le plus critique) -> OpenAI direct,
#   gpt-5.3-codex (paye avec le vrai budget OpenAI -- OPENAI_API_KEY). Alternative moins chere
#   identifiee mais PAS encore basculee (voir "qwen3-coder" plus bas) -- a tester en live sur
#   UN agent avant de generaliser, discipline deja etablie dans ce fichier.
# - test_deploy_agent / security_agent (lisent/testent du code) -> OpenRouter, GRATUIT,
#   nex-agi/nex-n2.5-pro:free (specialise agent de code, CONFIRME utilisable en appel direct).
# - Les 8 autres agents (research, contenu, email, social, seo, ads, les 2 supervisors) ->
#   OpenRouter, deepseek/deepseek-v4.1-flash ($0.035/$0.29 par MILLION de tokens, verifie en
#   direct via GET /api/v1/models le 2026-09-26 -- ~7x moins cher que gpt-5-mini utilise avant).
#   Contexte 1M tokens. CE N'EST PAS UN MODELE ":free" -- pas de limite 50/1000 requetes/jour,
#   mais ca CONSOMME du vrai credit OpenRouter payant.
#
# !!! BLOQUANT CONNU (2026-09-26) : le compte OpenRouter est a 0$ de credit (jamais rechargeR
# -- verifie en direct via GET /api/v1/credits). deepseek-v4.1-flash n'est PAS gratuit : sans
# credit sur le compte, tout appel echouera avec une erreur 402 Payment Required. Il faut que
# l'utilisateur ajoute quelques dollars de credit sur https://openrouter.ai/settings/credits
# avant que cette config fonctionne reellement (vu le prix, 5-10$ tient tres longtemps).
#
# Alternative backend/frontend identifiee mais non appliquee : qwen/qwen3-coder-30b-a3b-instruct
# ($0.07/$0.28 par million, specialise code, verifie en direct le 2026-09-26) coute une fraction
# de gpt-5.3-codex. Pas bascule par prudence -- backend/frontend sont le travail le plus critique
# de ce projet, et la regle etablie ici est de tester un nouveau modele en live sur UN agent
# avant de remplacer definitivement (voir l'historique des pannes plus bas). A tester des que
# du credit OpenRouter existe.
#
# Generation image/video (marketing) : image via OpenAI direct (gpt-image-1, OPENAI_API_KEY,
# deja fonctionnel avec du vrai credit) ; video via OpenRouter (google/veo-3.1-lite,
# tools/publishing/video_gen.py) -- pas d'equivalent video chez OpenAI actuellement, et
# OpenRouter est de toute facon le point d'entree le plus simple pour ce type de generation.
#
# HISTORIQUE DES PIEGES DEJA RENCONTRES (utile avant de retenter du gratuit un jour) :
# - "thinkingmachines/inkling:free" et "thinkingmachines/inkling-small:free" -> 403 "only
#   available on agentic harnesses" : reserves aux applications enregistrees chez OpenRouter
#   (Cursor, Cline...), IMPOSSIBLES a appeler depuis un script comme le notre.
# - "poolside/laguna-s-2.1:free" -> fonctionne en appel direct mais frequents 429 (surcharge).
# - "nvidia/nemotron-3-super-120b-a12b:free" -> fonctionne en appel direct mais a subi une
#   panne prolongee (502 "Service temporarily overloaded") qui a resiste a 4 tentatives de
#   relance automatique -- retire de la config le 2026-09-15 suite a cette panne.
# Avant de remettre un modele ":free" en config sur plusieurs agents, le tester d'abord tout
# seul sur UN agent avec une petite tache, pas l'assigner partout d'un coup.
#
# ATTENTION limites du tier gratuit OpenRouter (verifie sur openrouter.ai/docs le 2026-09-15) :
# - 20 requetes/minute sur n'importe quel modele finissant par ":free"
# - 50 requetes/JOUR au total si tu n'as JAMAIS achete de credit OpenRouter
# - 1000 requetes/jour si tu as achete au moins 10$ de credit un jour (meme si le solde
#   actuel est revenu a 0 -- c'est le total achete a vie qui compte, pas le solde)
# - Un solde NEGATIF bloque meme les modeles gratuits (erreur 402) -- rester a 0 ou plus.
#
# NB frontend_agent : screenshot_page (tools/browser_preview.py) ne renvoie une image que si
# le `model` commence par "anthropic:" (Claude direct). Avec gpt-5.3-codex ici, l'agent recoit
# le chemin du fichier, pas d'analyse visuelle automatique.
#
# Chaque appel modele (tous providers confondus) a une relance automatique integree
# (common/models.py, 4 tentatives, delai croissant) en cas de surcharge temporaire.

research_agent:
  model: "openai:deepseek/deepseek-v4.1-flash"
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  max_tokens: 4000
  max_iterations: 15

